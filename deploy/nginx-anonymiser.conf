# Reverse-proxy Nginx pour l'anonymiseur (Laravel Forge / VPS).
#
# À intégrer DANS le bloc `server { ... }` du site, via :
#   Forge → Site → Edit Files → Nginx Configuration
#
# Principe :
#   - /api/*  → backend Python (Gunicorn + CamemBERT) sur 127.0.0.1:5328
#   - /       → frontend Next.js sur 127.0.0.1:3000
#
# IMPORTANT : place le bloc `location /api/` AVANT le bloc `location /`.

# --- API Python (anonymisation) ------------------------------------------
location /api/ {
    proxy_pass http://127.0.0.1:5328;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;

    proxy_read_timeout 120s;     # cohérent avec le timeout Gunicorn
    client_max_body_size 12m;    # cohérent avec MAX_CONTENT_LENGTH (11 Mo)
}

# --- Frontend Next.js -----------------------------------------------------
location / {
    proxy_pass http://127.0.0.1:3000;
    proxy_http_version 1.1;
    proxy_set_header Upgrade $http_upgrade;
    proxy_set_header Connection "upgrade";
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
}
