# Reverse-proxy Nginx pour l'anonymiseur (Laravel Forge / VPS).
#
# À intégrer DANS le bloc `server { ... }` du site, via :
#   Forge → Site → Edit Files → Nginx Configuration
#
# Principe :
#   - /api/*  → backend Python (Gunicorn + CamemBERT) sur 127.0.0.1:5328
#   - /       → frontend Next.js sur 127.0.0.1:3000
#
# IMPORTANT : place le bloc `location /api/` AVANT le bloc `location /`.

# --- API Python (anonymisation) ------------------------------------------
location /api/ {
    proxy_pass http://127.0.0.1:5328;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;

    # Fichiers jusqu'à 100 Mo (ANON_MAX_FILE_MB) + enveloppe multipart.
    client_max_body_size 105m;
    client_body_timeout 300s;    # envoi lent d'un gros fichier

    # Suivi en direct du traitement (?stream=1, flux NDJSON) : chaque ligne
    # est transmise aussitôt au navigateur, et un « keepalive » est envoyé au
    # moins toutes les 10 s, ce qui maintient la connexion ouverte pendant
    # l'OCR d'un long document.
    proxy_buffering off;
    proxy_read_timeout 900s;     # mode direct (sans flux) : traitement long possible
    proxy_send_timeout 300s;
}

# --- Frontend Next.js -----------------------------------------------------
location / {
    proxy_pass http://127.0.0.1:3000;
    proxy_http_version 1.1;
    proxy_set_header Upgrade $http_upgrade;
    proxy_set_header Connection "upgrade";
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
}
